name: Cancel obsolete V10 runs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-obsolete-v10-runs.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete queued or running workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          for id in \
            29131893449 29131893452 29131893491 \
            29132432196 29132432172 29132432202 29132432303 \
            29132854685 29132854687 29132854682 29132854712 29132854711 \
            29133330716; do
            echo "cancelling $id"
            curl -sS -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/runs/${id}/cancel" || true
          done
