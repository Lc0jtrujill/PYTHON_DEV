name: V10 homogeneous MATLAB benchmark (manual matrix)
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        alpha: ['0.30','0.50','0.70','0.90']
        final_time: ['1','10','50']
    env:
      ALPHA: ${{ matrix.alpha }}
      FINAL_TIME: ${{ matrix.final_time }}
      REPEATS: '5'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - name: Download and verify official solver sources
        shell: bash
        run: |
          set -euxo pipefail
          cd fractional-pouzet-v10
          curl -fL --retry 3 -o fhbvm.m https://people.dimai.unifi.it/brugnano/fhbvm/fhbvm.m
          curl -fL --retry 3 -o fhbvm2.m https://people.dimai.unifi.it/brugnano/fhbvm/fhbvm2.m
          curl -fL --retry 3 -o FLMM2_official.zip https://www.mathworks.com/matlabcentral/mlc-downloads/downloads/submissions/47081/versions/1/download/zip
          unzip -oq FLMM2_official.zip
          test -s flmm2.m
      - uses: matlab-actions/run-command@v3
        with:
          command: cd('fractional-pouzet-v10'); v10_benchmark_case
      - uses: actions/upload-artifact@v4
        with:
          name: matlab-benchmark-a${{ matrix.alpha }}-T${{ matrix.final_time }}
          path: fractional-pouzet-v10/benchmark_*.csv
          if-no-files-found: error