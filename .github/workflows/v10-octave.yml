name: V10 homogeneous Octave benchmark (manual)
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OCTAVE_HISTFILE: /dev/null
      REPEATS: '5'
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave unzip
          octave --version
      - name: Download and verify official solver sources
        shell: bash
        run: |
          set -euxo pipefail
          cd fractional-pouzet-v10
          curl -fL --retry 3 -o fhbvm.m https://people.dimai.unifi.it/brugnano/fhbvm/fhbvm.m
          curl -fL --retry 3 -o fhbvm2.m https://people.dimai.unifi.it/brugnano/fhbvm/fhbvm2.m
          curl -fL --retry 3 -o FLMM2_official.zip https://www.mathworks.com/matlabcentral/mlc-downloads/downloads/submissions/47081/versions/1/download/zip
          unzip -oq FLMM2_official.zip
          test -s flmm2.m
          sha256sum fhbvm.m fhbvm2.m flmm2.m FLMM2_official.zip > official_SHA256SUMS.txt
      - name: Record environment
        shell: bash
        run: |
          cd fractional-pouzet-v10
          { uname -a; lscpu; octave --version; } > environment.txt
      - name: Run full factorial design
        shell: bash
        run: |
          cd fractional-pouzet-v10
          for a in 0.30 0.50 0.70 0.90; do
            for T in 1 10 50; do
              ALPHA="$a" FINAL_TIME="$T" octave --no-gui --quiet --eval 'v10_benchmark_case';
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: octave-benchmark-full-factorial
          path: |
            fractional-pouzet-v10/benchmark_*.csv
            fractional-pouzet-v10/environment.txt
            fractional-pouzet-v10/official_SHA256SUMS.txt
          if-no-files-found: error