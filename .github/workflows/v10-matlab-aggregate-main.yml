name: V10 official homogeneous MATLAB benchmark
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v10-matlab-aggregate-main.yml'
      - 'fractional-pouzet-v10/*.m'
      - 'fractional-pouzet-v10/TRIGGER_V10_MATLAB.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REPEATS: '5'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - name: Download and verify official solver sources
        shell: bash
        run: |
          set -euxo pipefail
          cd fractional-pouzet-v10
          curl -fL --retry 3 -o fhbvm.m https://people.dimai.unifi.it/brugnano/fhbvm/fhbvm.m
          curl -fL --retry 3 -o fhbvm2.m https://people.dimai.unifi.it/brugnano/fhbvm/fhbvm2.m
          curl -fL --retry 3 -o FLMM2_official.zip https://www.mathworks.com/matlabcentral/mlc-downloads/downloads/submissions/47081/versions/1/download/zip
          unzip -oq FLMM2_official.zip
          test -s flmm2.m
          echo '7c7ef38d76431078277e7f1f8c93b20d6635842f7567e29634194f7936520016  fhbvm.m' | sha256sum -c -
          echo '5a76f9acf5a8ce94c9c6f85e1c42c0555d31cae8e90f5bf2129d58dc3720a465  fhbvm2.m' | sha256sum -c -
          echo '6b31c6dcc24561cfd11e81af8b1bff7e768c47f50339c0a696b97abfb0519260  FLMM2_official.zip' | sha256sum -c -
          echo '8f0dd016ac9058cccd96caa1f7f094c0879ab040648fd4a22f52eb8b23cc60f5  flmm2.m' | sha256sum -c -
          sha256sum fhbvm.m fhbvm2.m flmm2.m FLMM2_official.zip > official_SHA256SUMS.txt
          { uname -a; lscpu; } > host_environment.txt
      - name: Run full factorial design in one MATLAB process
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            cd('fractional-pouzet-v10');
            fid=fopen('matlab_environment.txt','w');
            fprintf(fid,'%s\n',version);
            fprintf(fid,'computer=%s\n',computer);
            fprintf(fid,'maxNumCompThreads=%d\n',maxNumCompThreads(1));
            fclose(fid);
            aa=[0.30 0.50 0.70 0.90]; TT=[1 10 50];
            for ia=1:numel(aa), for it=1:numel(TT),
            setenv('ALPHA',sprintf('%.2f',aa(ia)));
            setenv('FINAL_TIME',sprintf('%g',TT(it)));
            v10_benchmark_case;
            end, end
      - name: Publish raw results and environment
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf fractional-pouzet-v10/results
          mkdir -p fractional-pouzet-v10/results
          cp fractional-pouzet-v10/benchmark_*.csv fractional-pouzet-v10/results/
          cp fractional-pouzet-v10/host_environment.txt fractional-pouzet-v10/results/
          cp fractional-pouzet-v10/matlab_environment.txt fractional-pouzet-v10/results/
          cp fractional-pouzet-v10/official_SHA256SUMS.txt fractional-pouzet-v10/results/
          (cd fractional-pouzet-v10/results && sha256sum * > SHA256SUMS.txt)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fractional-pouzet-v10/results
          git commit -m 'Publish V10 homogeneous MATLAB benchmark results [skip ci]'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: matlab-benchmark-full-factorial
          path: fractional-pouzet-v10/results
          if-no-files-found: error