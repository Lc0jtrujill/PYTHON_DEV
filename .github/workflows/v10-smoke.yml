name: V10 Octave benchmark smoke
on:
  push:
    branches: [v10-benchmark-run]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OCTAVE_HISTFILE: /dev/null
      REPEATS: '2'
      ALPHA: '0.50'
      FINAL_TIME: '1'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y octave unzip
      - name: Download official sources
        shell: bash
        run: |
          set -euxo pipefail
          cd fractional-pouzet-v10
          curl -fL --retry 3 -o fhbvm.m https://people.dimai.unifi.it/brugnano/fhbvm/fhbvm.m
          curl -fL --retry 3 -o fhbvm2.m https://people.dimai.unifi.it/brugnano/fhbvm/fhbvm2.m
          curl -fL --retry 3 -o FLMM2_official.zip https://www.mathworks.com/matlabcentral/mlc-downloads/downloads/submissions/47081/versions/1/download/zip
          unzip -oq FLMM2_official.zip
      - run: cd fractional-pouzet-v10 && octave --no-gui --quiet --eval 'v10_benchmark_case'
      - uses: actions/upload-artifact@v4
        with:
          name: v10-smoke-result
          path: fractional-pouzet-v10/benchmark_*.csv
